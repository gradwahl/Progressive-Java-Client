name: Apply legacy GPU extraction

on:
  push:
    branches:
      - refactor/legacy-gpu-extraction

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/legacy-gpu-extraction
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Apply mechanical extraction
        run: |
          sed -i 's/"buildProgram(UI_VERT_SRC", "glUseProgram(prog)"/"uiProg = buildProgram", "glUseProgram(prog)"/' tools/refactor_legacy_gpu.py
          python3 tools/refactor_legacy_gpu.py

      - name: Check patch formatting
        run: git diff --check

      - name: Compile extracted legacy GPU classes
        run: |
          mvn --batch-mode dependency:build-classpath -Dmdep.outputFile=/tmp/refactor-cp.txt
          mkdir -p /tmp/refactor-stubs/jagex2/graphics /tmp/refactor-classes /tmp/empty-sourcepath
          cat > /tmp/refactor-stubs/jagex2/graphics/Pix3D.java <<'EOF'
          package jagex2.graphics;
          public final class Pix3D {
              public static final int TEXTURE_COUNT = 50;
              public static final Object[] textures = new Object[TEXTURE_COUNT];
              public static final int[][] texturePalette = new int[TEXTURE_COUNT][];
              public static final boolean[] textureTranslucent = new boolean[TEXTURE_COUNT];
              public static final int[] colourTable = new int[65536];
              public static boolean lowMem;
              public static int[] getTexels(int id) { return new int[128 * 128]; }
          }
          EOF
          javac --release 17 -d /tmp/refactor-classes /tmp/refactor-stubs/jagex2/graphics/Pix3D.java
          javac --release 17 \
            -cp "/tmp/refactor-classes:$(cat /tmp/refactor-cp.txt)" \
            -sourcepath /tmp/empty-sourcepath \
            -d /tmp/refactor-classes \
            src/main/java/com/gradwahl/rs254/gl/GlShader.java \
            src/main/java/com/gradwahl/rs254/gl/GlTextureManager.java \
            src/main/java/com/gradwahl/rs254/gl/LegacyGpuRenderer.java

      - name: Commit extracted renderer
        run: |
          rm tools/refactor_legacy_gpu.py .github/workflows/refactor-legacy-gpu.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: extract legacy GPU renderer"
          git push origin HEAD:refactor/legacy-gpu-extraction
